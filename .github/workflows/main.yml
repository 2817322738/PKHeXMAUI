name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - pkhexmobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore PKHeX.MAUI.csproj

      - name: Build APK
        run: dotnet publish PKHeX.MAUI.csproj -f net10.0-android36.0 -c Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-MAUI-Android
          path: |
            **/bin/Release/net10.0-android36.0/publish/*.apk
