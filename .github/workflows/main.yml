name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - pkhexmobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        working-directory: /tmp
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore Android project
        run: dotnet restore PKHeX.MAUI.csproj -p:TargetFramework=net10.0-android36.0 -r android-arm64

      - name: Build Android APK
        run: dotnet publish PKHeX.MAUI.csproj -f net10.0-android36.0 -c Release -r android-arm64 --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-MAUI-Android
          path: '**/bin/Release/net10.0-android36.0/android-arm64/publish/*.apk'
